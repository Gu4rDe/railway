<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .title { font: 700 30px Arial, "DejaVu Sans", sans-serif; fill: #172033; }
      .label { font: 600 18px Arial, "DejaVu Sans", sans-serif; fill: #172033; }
      .usecase { font: 16px Arial, "DejaVu Sans", sans-serif; fill: #172033; }
      .actor { font: 17px Arial, "DejaVu Sans", sans-serif; fill: #172033; }
      .system { fill: #f7f9fc; stroke: #455468; stroke-width: 3; }
      .ellipse { fill: #ffffff; stroke: #2f5d8a; stroke-width: 2.5; }
      .line { stroke: #344054; stroke-width: 2; fill: none; }
      .include { stroke: #667085; stroke-width: 1.7; fill: none; stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#667085" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Диаграмма вариантов использования</text>
  <text x="800" y="78" text-anchor="middle" class="label">Информационная система «Железная дорога»</text>

  <rect x="300" y="105" width="1000" height="900" rx="8" class="system"/>
  <text x="800" y="140" text-anchor="middle" class="label">Система «Железная дорога»</text>

  <!-- actors -->
  <g transform="translate(120,220)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#172033" stroke-width="2.5"/>
    <path d="M0,20 L0,92 M-38,48 L38,48 M0,92 L-30,137 M0,92 L30,137" class="line"/>
    <text x="0" y="170" text-anchor="middle" class="actor">Администратор</text>
  </g>
  <g transform="translate(120,535)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#172033" stroke-width="2.5"/>
    <path d="M0,20 L0,92 M-38,48 L38,48 M0,92 L-30,137 M0,92 L30,137" class="line"/>
    <text x="0" y="170" text-anchor="middle" class="actor">Оператор</text>
    <text x="0" y="192" text-anchor="middle" class="actor">на станции</text>
  </g>
  <g transform="translate(1480,785)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#172033" stroke-width="2.5"/>
    <path d="M0,20 L0,92 M-38,48 L38,48 M0,92 L-30,137 M0,92 L30,137" class="line"/>
    <text x="0" y="170" text-anchor="middle" class="actor">Пользователь</text>
  </g>

  <!-- use cases -->
  <g>
    <ellipse cx="510" cy="210" rx="145" ry="38" class="ellipse"/>
    <text x="510" y="216" text-anchor="middle" class="usecase">Войти в систему</text>

    <ellipse cx="800" cy="210" rx="160" ry="38" class="ellipse"/>
    <text x="800" y="216" text-anchor="middle" class="usecase">Управлять станциями</text>

    <ellipse cx="1080" cy="210" rx="160" ry="38" class="ellipse"/>
    <text x="1080" y="216" text-anchor="middle" class="usecase">Управлять операторами</text>

    <ellipse cx="800" cy="325" rx="160" ry="38" class="ellipse"/>
    <text x="800" y="331" text-anchor="middle" class="usecase">Управлять поездами</text>

    <ellipse cx="560" cy="485" rx="145" ry="38" class="ellipse"/>
    <text x="560" y="491" text-anchor="middle" class="usecase">Принять груз</text>

    <ellipse cx="880" cy="485" rx="170" ry="38" class="ellipse"/>
    <text x="880" y="491" text-anchor="middle" class="usecase">Распределить груз</text>

    <ellipse cx="800" cy="610" rx="155" ry="38" class="ellipse"/>
    <text x="800" y="616" text-anchor="middle" class="usecase">Получить груз</text>

    <ellipse cx="500" cy="780" rx="150" ry="38" class="ellipse"/>
    <text x="500" y="786" text-anchor="middle" class="usecase">Отправить груз</text>

    <ellipse cx="800" cy="780" rx="165" ry="38" class="ellipse"/>
    <text x="800" y="786" text-anchor="middle" class="usecase">Отследить груз</text>

    <ellipse cx="800" cy="900" rx="155" ry="38" class="ellipse"/>
    <text x="800" y="906" text-anchor="middle" class="usecase">Выйти из системы</text>
  </g>

  <!-- actor associations: routed separately to avoid crossings -->
  <path d="M140,220 L365,210" class="line"/>
  <path d="M140,220 L140,170 L640,170 L640,210" class="line"/>
  <path d="M140,220 L140,155 L920,155 L920,210" class="line"/>
  <path d="M140,220 L140,325 L640,325" class="line"/>

  <path d="M140,535 L415,485" class="line"/>
  <path d="M140,535 L710,485" class="line"/>
  <path d="M140,535 L645,610" class="line"/>

  <path d="M1460,785 L1350,785 L1350,780 L665,780" class="line"/>
  <path d="M1460,785 L1370,785 L1370,610 L955,610" class="line"/>
  <path d="M1460,785 L1400,785 L1400,160 L655,160 L655,210" class="line"/>

  <text x="800" y="1045" text-anchor="middle" class="usecase">Основные функции системы и взаимодействующие с ней актёры</text>
</svg>
